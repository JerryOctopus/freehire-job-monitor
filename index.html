<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 岗位 · 求职看板</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172c31;background:#f3f6f4;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:44px 28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:#527363;font-size:12px;letter-spacing:2px}h1{font-size:32px;margin:9px 0 12px;font-weight:650}p{line-height:1.7}.sub{color:#5a6d70;margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #c7d5cf;background:white;color:#234e43;border-radius:9px;padding:9px 13px}button:hover{background:#eaf2ed}button:focus-visible,a:focus-visible{outline:3px solid #57a6cd;outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 16px}.tab.selected{background:#204f43;color:white;border-color:#204f43}input,select{background:white;border:1px solid #ccd6d1;border-radius:9px;padding:10px 12px;color:#243e36}input{flex:1;min-width:180px}.notice{padding:12px 15px;border-radius:9px;margin:16px 0;background:#e6eee9;font-size:13px;color:#3b5b4c}.error{background:#fce7e1;color:#8b3326}.meta{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:#687975;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #dce4df;border-radius:14px;padding:23px;display:flex;flex-direction:column;gap:12px}.company{font-size:13px;color:#567466;font-weight:600}.title{font-size:19px;line-height:1.45;font-weight:650;margin:0;color:#193e34;text-decoration:none}.title:hover{text-decoration:underline}.details{color:#5c6e68;line-height:1.7;font-size:13px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#f0f4f1;padding:4px 8px;border-radius:5px;font-size:11px;color:#527061}.pending{color:#946b29;background:#fbf2df}.summary{font-size:13px;line-height:1.7;margin:0;color:#485b54;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}.primary{background:#204f43;color:white;border-color:#204f43}.primary:hover{background:#326757}.quiet{color:#7a625c}.external{font-size:13px;align-self:center;color:#456c5b;margin-right:auto;text-decoration:none}details{font-size:13px;line-height:1.7;color:#516159}summary{cursor:pointer}.jd{white-space:pre-wrap;max-height:300px;overflow:auto;margin-top:12px}.empty{grid-column:1/-1;padding:70px 25px;text-align:center;color:#697b72;background:white;border-radius:14px;border:1px dashed #cad8cf}.footer{font-size:12px;color:#74857c;margin-top:30px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1d4438;color:white;padding:13px 20px;border-radius:10px;z-index:2;max-width:90vw}.hidden{display:none}@media(max-width:720px){main{padding:26px 16px}.grid{grid-template-columns:1fr}header{align-items:start}h1{font-size:26px}.meta{flex-direction:column;gap:6px}.toolbar{margin-top:22px}.card{padding:19px}}
</style>
<main>
<header><div><div class="eyebrow">FREEHIRE / CAREER WORKSPACE</div><h1>AI 岗位看板</h1><p class="sub">把机会留下，把已处理的岗位收好。</p></div><button id="refresh">刷新清单</button></header>
<div class="notice">点击「已投递」或「不合适」后将保存标记，之后的定时检索不再推送该岗位。可随时在对应列表中恢复。</div>
<div class="toolbar"><button class="tab selected" data-tab="active">待处理 <span id="count-active">0</span></button><button class="tab" data-tab="applied">已投递 <span id="count-applied">0</span></button><button class="tab" data-tab="dismissed">不合适 <span id="count-dismissed">0</span></button><input id="search" aria-label="搜索岗位" placeholder="搜索公司、岗位、城市…"><select id="recommendation" aria-label="投递建议"><option value="all">全部投递建议</option><option>建议投递</option><option>补充材料后投递</option><option>谨慎投递</option><option>暂不建议投递</option></select><select id="qualification" aria-label="匹配状态"><option value="all">全部匹配状态</option><option value="confirmed">检索条件已核对</option><option value="pending">待核实</option></select></div>
<p><a href="/audit.html" target="_blank">查看全部筛选审计</a> · <a href="/api/jobs" download="freehire-all-jobs.json">下载完整岗位 JSON</a></p><div class="meta"><span id="result-count">正在读取…</span><span id="updated"></span></div>
<div id="coverage" class="notice"></div><div id="error" class="notice error hidden" role="alert"></div><section id="jobs" class="grid" aria-label="岗位列表"></section>
<div class="toolbar"><button id="prev">上一页</button><span id="page-info"></span><button id="next">下一页</button></div><p class="footer">标记保存在本机，与早间、午间检索共用。已投递按钮只记录状态，不会向雇主提交申请。</p>
</main><div id="toast" class="hidden" role="status"></div>
<script>
let data={jobs:[]}, tab='active', busy=false, toastTimer, page=1;
const $=id=>document.getElementById(id);
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function url(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function link(label,href,cls){const a=node('a',cls,label);a.href=url(href)||'#';a.target='_blank';a.rel='noopener noreferrer';return a;}
function date(value){return value?new Date(value).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'未知';}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000);}
function fail(message){$('error').textContent=message;$('error').classList.remove('hidden');}
async function load(){try{const r=await fetch('/api/jobs',{cache:'no-store'});if(!r.ok)throw Error('读取失败');data=await r.json();$('error').classList.add('hidden');render();}catch(e){fail('无法连接本机看板服务。请运行 python3 board.py serve 后，打开 http://127.0.0.1:8769 。');$('result-count').textContent='连接失败，尚未加载岗位';}}
async function mark(job,status){if(busy)return;busy=true;document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:job.key,status})});const body=await r.json();if(!r.ok)throw Error(body.error||'保存失败');data=body;render();toast(status==='active'?'已恢复到待处理':'已保存，后续不再推送该岗位');}catch(e){fail(e.message+'；请重试。');}finally{busy=false;document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);}}
function action(job,label,status,cls){const b=node('button',cls,label);b.addEventListener('click',()=>mark(job,status));return b;}
function matchPanel(job){
 const box=node('div','notice'),m=job.match;
 if(!m){box.textContent='简历适配：尚未分析。检索条件通过不代表个人匹配。';return box;}
 box.append(node('strong',null,'简历适配：'+(m.recommendation||'待分析')));
 if(m.method)box.append(node('p','summary',m.method));
 if(m.summary)box.append(node('p','summary',m.summary));
 const details=node('details');details.append(node('summary',null,'匹配依据与风险'));
 for(const [key,label] of [['strengths','匹配优势'],['gaps','缺口 / 待确认'],['hard_gates','硬性门槛']]){
  const values=m[key];if(!values)continue;
  details.append(node('strong',null,label));
  for(const v of (Array.isArray(values)?values:[values]))details.append(node('p','summary',typeof v==='string'?v:JSON.stringify(v)));
 }
 if(m.evidence_matrix?.length){const em=node('details');em.append(node('summary',null,'逐项JD要求与简历证据'));for(const row of m.evidence_matrix){em.append(node('strong',null,row.jd_requirement));em.append(node('p','summary',(row.resume_evidence||[]).join('；')));em.append(node('p','summary',row.status+'：'+row.risk));}details.append(em);}
 if(m.resume_version)details.append(node('p','summary','简历版本：'+m.resume_version));
 box.append(details);return box;
}
function render(){const q=$('search').value.trim().toLowerCase(),qual=$('qualification').value;for(const s of ['active','applied','dismissed'])$('count-'+s).textContent=data.jobs.filter(j=>j.status===s).length;
const jobs=data.jobs.filter(j=>j.status===tab&&($('recommendation').value==='all'||j.match?.recommendation===$('recommendation').value)&&(qual==='all'||j.qualification===qual)&&[j.company,j.title,j.location,j.direction].join(' ').toLowerCase().includes(q));
const totalPages=Math.max(1,Math.ceil(jobs.length/40));page=Math.max(1,Math.min(page,totalPages));$('page-info').textContent=`第 ${page} / ${totalPages} 页`;$('prev').disabled=page===1;$('next').disabled=page===totalPages;
$('coverage').textContent='覆盖范围：'+(data.coverage_note||'本轮覆盖范围未注明，请查看检索记录。');$('result-count').textContent=`共 ${jobs.length} 个岗位，本页显示 ${Math.min(40,Math.max(0,jobs.length-(page-1)*40))} 个；全部结果可翻页或下载`;$('updated').textContent='清单更新：'+date(data.updated_at);$('jobs').replaceChildren();
if(!jobs.length){$('jobs').append(node('div','empty',tab==='active'?'当前没有待处理岗位。新一轮检索完成后，点击「刷新清单」。':'这里暂时没有岗位。'));return;}
for(const j of jobs.slice((page-1)*40,page*40)){const c=node('article','card');c.append(node('div','company',j.company||'公司未注明'));c.append(link(j.title||'未命名岗位',j.public_slug?'https://freehire.me/jobs/'+encodeURIComponent(j.public_slug):j.url,'title'));c.append(node('div','details',[j.location||'地点待核实',j.work_mode||'工作方式待核实',j.experience_label||'年限待核实'].join(' · ')));const tags=node('div','tags');tags.append(node('span','tag '+(j.qualification==='confirmed'?'':'pending'),j.qualification==='confirmed'?'检索条件已核对':'待核实'));if(j.direction)tags.append(node('span','tag',j.direction));tags.append(node('span','tag','发布：'+(j.posted_at?date(j.posted_at).split(' ')[0]:'待核实')));c.append(tags);if(j.review_note)c.append(node('p','summary',j.review_note));c.append(matchPanel(j));if(j.description){const d=node('details');d.append(node('summary',null,'查看职位详情'));d.append(node('div','jd',j.description));c.append(d);}const actions=node('div','actions');if(url(j.url))actions.append(link('原始申请 ↗',j.url,'external'));if(tab!=='applied')actions.append(action(j,'已投递','applied','primary'));if(tab!=='dismissed')actions.append(action(j,'不合适','dismissed','quiet'));if(tab!=='active')actions.append(action(j,'恢复推荐','active',''));c.append(actions);$('jobs').append(c);}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;page=1;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('selected',x===b));render();}));$('search').addEventListener('input',()=>{page=1;render();});$('qualification').addEventListener('change',()=>{page=1;render();});$('recommendation').addEventListener('change',()=>{page=1;render();});$('prev').addEventListener('click',()=>{page--;render();window.scrollTo(0,0);});$('next').addEventListener('click',()=>{page++;render();window.scrollTo(0,0);});$('refresh').addEventListener('click',load);load();
</script>
</html>
