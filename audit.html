<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整检索审计</title><style>body{font:14px/1.7 system-ui;margin:28px;background:#f3f6f4;color:#234235}a{color:#28614b}button,input,select{font:inherit;padding:9px;border:1px solid #bacdc2;border-radius:7px;background:white;margin:5px}table{border-collapse:collapse;background:white;width:100%}td,th{padding:12px;border:1px solid #dce5de;text-align:left;vertical-align:top}.scroll{overflow:auto}#info{margin:20px 0}h1{font-size:26px}</style><h1>完整检索审计</h1><p><a href="/">返回岗位看板</a> · <a href="/api/audit" download="freehire-screening-audit.json">下载全部审计记录</a></p><p>以下包含本次查询去重后的全部记录，含保留候选、待核实、超期、经验/地区/方向排除及重复项。排除属于规则初核，存在不确定性时可从原始JD复核。分页只影响显示，不截断数据。</p><input id="search" placeholder="搜索公司、岗位、原因…" aria-label="审计搜索"><select id="filter" aria-label="审计状态"><option value="all">全部状态</option><option value="候选">候选</option><option value="待核实">待核实</option><option value="超过14天">超过14天</option><option value="实习">实习排除</option><option value="经验">经验排除</option><option value="地区">地区排除</option><option value="方向">方向排除</option><option value="重复">重复项</option></select><div id="info">读取中…</div><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><div class="scroll"><table><thead><tr><th>公司</th><th>岗位</th><th>地点</th><th>发布时间</th><th>处理结果</th><th>依据</th></tr></thead><tbody id="rows"></tbody></table></div><script>
let items=[],page=1;const $=x=>document.getElementById(x);function render(){let q=$('search').value.trim().toLowerCase(),f=$('filter').value;const rows=items.filter(j=>(f==='all'||j.outcome.includes(f))&&[j.title,j.company,j.location,j.outcome,j.reason].join(' ').toLowerCase().includes(q));let pages=Math.max(1,Math.ceil(rows.length/100));page=Math.max(1,Math.min(page,pages));$('page').textContent=`第 ${page}/${pages} 页`;$('prev').disabled=page===1;$('next').disabled=page===pages;$('info').textContent=`本次去重后全部 ${items.length} 条；当前筛选 ${rows.length} 条。`;$('rows').replaceChildren();for(const j of rows.slice((page-1)*100,page*100)){let tr=document.createElement('tr');for(const key of ['company','title','location','posted_at','outcome','reason']){let td=document.createElement('td');if(key==='title'){let a=document.createElement('a');a.textContent=j.title;a.href='https://freehire.me/jobs/'+encodeURIComponent(j.public_slug);a.target='_blank';a.rel='noopener';td.append(a);}else td.textContent=j[key]??'未注明';tr.append(td);}$('rows').append(tr);}}$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('search').oninput=()=>{page=1;render();};$('filter').onchange=()=>{page=1;render();};fetch('/api/audit').then(r=>{if(!r.ok)throw Error('读取失败');return r.json();}).then(d=>{items=d.records;render();}).catch(e=>$('info').textContent=e.message);
</script></html>
